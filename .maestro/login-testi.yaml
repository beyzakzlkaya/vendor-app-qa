# İlk gerçek test: giriş akışı (iOS + Android ortak çalışır)
# Kimlik bilgileri .env dosyasından gelir: TEST_EMAIL, TEST_PASSWORD
appId: com.getmobil.vendor
---
- launchApp:
    clearState: true
    permissions:
      all: allow

# Uygulama "Kayıt Ol" sekmesinde açılıyor — önce "Giriş Yap" sekmesine geç
- tapOn: 'Giriş Yap'

# Giriş formu yüklendi mi?
- assertVisible:
    id: 'login_username_input'
- assertVisible:
    id: 'login_password_input'

# Kimlik bilgilerini gir
- tapOn:
    id: 'login_username_input'
- inputText: ${TEST_EMAIL}
- tapOn:
    id: 'login_password_input'
- inputText: ${TEST_PASSWORD}
- hideKeyboard

# iOS "Save Password?" diyaloğu çıkarsa kapat
- runFlow:
    when:
      visible: 'Not Now'
    commands:
      - tapOn: 'Not Now'

# Giriş yap
- tapOn:
    id: 'login_button'

# Girişten sonra karşılama balonu çıkarsa kapat
- extendedWaitUntil:
    visible: 'Anladım'
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: 'Anladım'
    commands:
      - tapOn: 'Anladım'

# Ana ekran (dashboard) geldi mi?
# Not: drawer_menu_button testID'si iOS'ta dışa açılmıyor (Android'de çalışıyor),
# bu yüzden platformdan bağımsız görünen "Anasayfa" sekmesini doğruluyoruz.
- extendedWaitUntil:
    visible: 'Anasayfa'
    timeout: 20000
