# TC-FIN-001 — Satıcı cüzdan bakiyesini ve işlem geçmişini görüntüler (mobil uyarlama v2)
# Kaynak: getmobil-e2e-test-prompt-library/domains/financials/TC-FIN-001-vendor-view-wallet.md
#
# Uygulama yapısı: Alt menü "Kasam" → doğrudan cüzdan sayfası
# (Toplam Bakiye, Vadesi Gelmiş/Gelmemiş, Hızlı İşlemler, Son İşlemler)
# Doğrulamalar sayfaya ÖZGÜ öğelerle — bulunamazsa test HATA verir.
appId: com.getmobil.vendor
---
- runFlow: subflows/giris.yaml

# 1) Kasam sekmesine geç
- tapOn: 'Kasam'

# 2) Cüzdan sayfası doğrulaması — cüzdana özgü öğeler (ER-1/ER-2 karşılığı)
- extendedWaitUntil:
    visible: 'Toplam Bakiye'          # cüzdana özgü — yoksa yanlış ekrandayız
    timeout: 15000
- assertVisible: 'Vadesi Gelmiş'
- assertVisible: 'Hızlı İşlemler'

# Değer kontrolleri (ER-2): bakiye TRY formatında bir sayı olmalı
- assertVisible: '-?[0-9][0-9.,]* ₺'  # bakiye formatı (negatif olabilir)
- assertVisible: 'Kullanılabilir'
- assertVisible: '.*Para Yükle.*'
- assertVisible: '.*Para Çek.*'
- takeScreenshot: 04-kasam-bakiye

# 3) İşlem geçmişi (ER-3 karşılığı): Son İşlemler bölümüne kaydır
- scrollUntilVisible:
    element:
      text: 'Son İşlemler'
    direction: DOWN
- assertVisible: 'Son İşlemler'
- takeScreenshot: 05-son-islemler
