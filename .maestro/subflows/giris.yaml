# Ortak alt akış: temiz kurulumla giriş yap, ana sayfaya ulaş
# Kaynak case: TC-IDENTITY-001 (getmobil-e2e-test-prompt-library)
appId: com.getmobil.vendor
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn: 'Giriş Yap'
- assertVisible:
    id: 'login_username_input'
- tapOn:
    id: 'login_username_input'
- inputText: ${TEST_EMAIL}
- tapOn:
    id: 'login_password_input'
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- runFlow:
    when:
      visible: 'Not Now'
    commands:
      - tapOn: 'Not Now'
- tapOn:
    id: 'login_button'
- extendedWaitUntil:
    visible: 'Anladım'
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: 'Anladım'
    commands:
      - tapOn: 'Anladım'
- extendedWaitUntil:
    visible: 'Anasayfa'
    timeout: 20000
